[package]
name = "war3-model-blp-jpeg-decoder"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
